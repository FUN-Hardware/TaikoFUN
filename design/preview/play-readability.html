<style>body{margin:0;padding:24px;background:#11182e;color:#fff;font:16px system-ui,sans-serif}main{max-width:1280px;margin:auto}h1{font-size:22px}p{color:#bac5dd;line-height:1.7}canvas{display:block;width:100%;height:auto;background:#4054a3;border-radius:8px}nav{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}button{font:inherit;padding:10px 16px;color:white;background:#263353;border:1px solid #7888ac;border-radius:6px;cursor:pointer}button[aria-pressed=true]{background:#0086ae;border-color:white}label{display:flex;align-items:center;gap:16px}output{font-variant-numeric:tabular-nums}#status{padding:12px 0;color:#ffdb00}</style>
<main><h1>TaikoFUN 判定・ミニ太鼓・レイヤー確認</h1><p>画面設計のプレビューです。実ゲームのビルド・動作確認ではありません。ノーツは表示例です。</p>
<canvas id="stage" width="1280" height="460" aria-label="レーン左のミニ太鼓と、星の上に表示するノーツ"></canvas>
<nav aria-label="表示する判定"><button data-mode="don" aria-pressed="true">ドン（良）</button><button data-mode="katsu" aria-pressed="false">カツ（良）</button><button data-mode="bad" aria-pressed="false">不可（打鍵）</button><button data-mode="miss" aria-pressed="false">見逃し</button><button data-mode="empty" aria-pressed="false">空打ち</button><button data-mode="dense" aria-pressed="false">連続ヒット</button></nav>
<nav aria-label="ミニ太鼓の入力"><button data-drum="0">D：左カッ</button><button data-drum="1">F：左ドン</button><button data-drum="2">J：右ドン</button><button data-drum="3">K：右カッ</button><button id="autoDrum" aria-pressed="false">オート発光デモ</button><button id="resetDrum">太鼓の発光をリセット</button></nav>
<p>キーボードのD/F/J/Kも使えます。同時押し可。オート発光デモは左右交互・大音符の両側発光を表示する模擬入力です。</p>
<label><input id="gogo" type="checkbox"> ゴーゴータイム：背景を保ち、判定枠に炎を表示</label>
<label>ヒットからの時間 <input id="age" type="range" min="0" max="240" value="80" step="1"><output id="ageValue">80 ms</output></label>
<p id="status" role="status">素材を読み込み中</p><p>描画順：レーンの発光 → 星・流線 → 判定枠・ノーツ → 判定文字。見逃しでは判定文字を消し、コンボをリセットします。</p></main>

const canvas=document.getElementById('stage'),ctx=canvas.getContext('2d'),images={};let mode='don';
let drumHitAt=[-Infinity,-Infinity,-Infinity,-Infinity],autoDrumDemo=false,autoDrumRight=false,lastAutoDrumAt=0,autoDrumStep=0;
function pulseDrum(part){drumHitAt[part]=performance.now()}
function pulseAutoDrum(katsu,big=false){const left=katsu?0:1,right=katsu?3:2;if(big){pulseDrum(left);pulseDrum(right)}else{pulseDrum(autoDrumRight?right:left);autoDrumRight=!autoDrumRight}}
function animateDrum(now){if(autoDrumDemo&&now-lastAutoDrumAt>=350){const step=autoDrumStep++%8;pulseAutoDrum(step===2||step===3||step===5,step===4||step===5);lastAutoDrumAt=now}draw();requestAnimationFrame(animateDrum)}
const ease=t=>1-Math.pow(1-Math.max(0,Math.min(1,t)),3);
function centered(img,x,y,w,h,angle=0){ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.drawImage(img,-w/2,-h/2,w,h);ctx.restore()}
function circle(x,y,r,fill,stroke,width=1){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke()}}
function drum(){centered(images.body,282,253,60,96);centered(images.body,282,253,60,96,Math.PI);centered(images.face,246,253,108,108);circle(246,253,44,'#fffaeb');const now=performance.now();drumHitAt.forEach((at,i)=>{const age=(now-at)/1000;if(age>=.18)return;const left=i<2,rim=i===0||i===3;ctx.save();ctx.beginPath();ctx.rect(left?192:246,199,54,108);ctx.clip();ctx.globalAlpha=.9*(1-age/.18);circle(246,253,rim?49:43,rim?null:'#da0010',rim?'#46d2ff':null,8);ctx.restore()});circle(246,253,39,null,'#202a52');ctx.strokeStyle='#202a52';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(246,214);ctx.lineTo(246,292);ctx.stroke();ctx.font='14px sans-serif';['D','F','J','K'].forEach((key,i)=>{ctx.fillStyle=(performance.now()-drumHitAt[i])<180?(i===0||i===3?'#46d2ff':'#ff5555'):'#bac5dd';ctx.fillText(key,[195,226,260,290][i],337)})}
function gogoFire(){if(!document.getElementById('gogo').checked)return;const img=images.gogoFire,w=img.width/4,h=img.height/2,frame=Math.min(7,Math.floor((performance.now()/1000%(8/12))*12));ctx.save();ctx.globalAlpha=.85;ctx.drawImage(img,(frame%4)*w,Math.floor(frame/4)*h,w,h,311,175,156,156);ctx.restore()}
function burst(age,spin,color){const t=age/.24;if(t>=1)return;const e=ease(t);ctx.save();ctx.globalAlpha=(1-t)*.6;circle(389,253,42+26*e,null,color,6*(1-t)+1);for(let k=0;k<4;k++){const a=spin+k*Math.PI/2,r=48+28*e,s=.06*(1-.5*t);ctx.globalAlpha=Math.pow(1-t,1.5)*.55;centered(images.streak,389+Math.cos(a)*r,253+Math.sin(a)*r,images.streak.width*s,images.streak.height*s,a+Math.PI)}const s=.12+.08*e;ctx.globalAlpha=(t<.3?1:1-(t-.3)/.7)*.7;centered(images.star,389,253,images.star.width*s,images.star.height*s,spin+e*.6);ctx.restore()}
function draw(){if(!images.face)return;const age=Number(document.getElementById('age').value)/1000,color=mode==='katsu'?'#0086ae':'#da0010';ctx.clearRect(0,0,1280,460);ctx.fillStyle='#4054a3';ctx.fillRect(0,0,1280,460);ctx.fillStyle='#fff';ctx.font='bold 22px sans-serif';ctx.fillText('シャイニングスター / レイヤー表示例',38,104);ctx.fillStyle='#202a52';ctx.fillRect(325,189,955,130);
if(!['miss','bad'].includes(mode)&&age<.18){for(let i=0;i<10;i++){ctx.globalAlpha=(1-age/.18)*.45*(1-i/10);ctx.fillStyle=color;ctx.fillRect(325+955*i/10,189,955/10,130)}ctx.globalAlpha=1}
gogoFire();ctx.save();ctx.beginPath();ctx.rect(325,189,955,130);ctx.clip();if(['don','katsu','dense'].includes(mode)){const count=mode==='dense'?8:1;for(let i=0;i<count;i++)burst(age+i*.016,i*37*Math.PI/180,color)}circle(389,253,57,null,'#ffffff',4);circle(389,253,49,null,'#9aa8cb',2);
[451,538,625,774,946,1130].forEach((x,i)=>{circle(x,253,59,'#fff','#111',3);circle(x,253,53,i%3===1?'#0086ae':'#da0010');ctx.fillStyle='#202a52';ctx.beginPath();ctx.arc(x-15,243,3,0,7);ctx.arc(x+15,243,3,0,7);ctx.fill();ctx.strokeStyle='#202a52';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,251,22,.2,Math.PI-.2);ctx.stroke()});ctx.restore();drum();
if(['don','katsu','dense','bad'].includes(mode)){const img=mode==='bad'?images.bad:images.good;const h=44,w=h*img.width/img.height;centered(img,389,159-14*ease(age/.5),w,h)}
ctx.fillStyle='#fff';ctx.font='bold 28px sans-serif';ctx.fillText(['miss','bad'].includes(mode)?'0 コンボ':'128 コンボ',54,392);
document.getElementById('ageValue').value=Math.round(age*1000)+' ms';document.getElementById('status').textContent=mode==='miss'?'見逃し：判定文字なし / コンボ 0':mode==='bad'?'打鍵の不可：不可を表示 / コンボ 0':mode==='empty'?'空打ち：レーンだけ発光 / 判定文字なし':'星の上に次のノーツを表示';canvas.dataset.mode=mode}
document.querySelectorAll('button[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('button[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));draw()}));document.getElementById('age').addEventListener('input',draw);document.getElementById('gogo').addEventListener('change',draw);
document.querySelectorAll('button[data-drum]').forEach(b=>b.addEventListener('click',()=>pulseDrum(Number(b.dataset.drum))));
document.addEventListener('keydown',e=>{if(e.repeat||e.target?.matches?.('input,textarea,[contenteditable=true]'))return;const part={d:0,f:1,j:2,k:3}[e.key.toLowerCase()];if(part!==undefined){e.preventDefault();pulseDrum(part)}});
document.getElementById('autoDrum').addEventListener('click',()=>{autoDrumDemo=!autoDrumDemo;document.getElementById('autoDrum').setAttribute('aria-pressed',String(autoDrumDemo));lastAutoDrumAt=performance.now()});
document.getElementById('resetDrum').addEventListener('click',()=>{drumHitAt.fill(-Infinity);autoDrumRight=false;autoDrumStep=0;autoDrumDemo=false;document.getElementById('autoDrum').setAttribute('aria-pressed','false')});
Promise.all(Object.entries(sources).map(([k,url])=>new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>{images[k]=image;resolve()};image.onerror=()=>reject(new Error(k));image.src=url}))).then(()=>requestAnimationFrame(animateDrum)).catch(e=>document.getElementById('status').textContent='素材の読み込みに失敗: '+e.message);
