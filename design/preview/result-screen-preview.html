<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TaikoFUN リザルト表示見本</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#211711;color:#3d201c;font-family:Meiryo,sans-serif}header{color:#fff;padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select,input{font:inherit;padding:7px;border-radius:8px;border:1px solid #aaa}main{position:relative;width:1280px;height:720px;background:url('../../TaikoFUN/Resource/Image/SkinColor/resultbg_clear.png');transform-origin:top left}.panel{position:absolute;background:rgba(255,252,235,.92);border-radius:22px}.top{left:40px;top:25px;width:1200px;height:150px;padding:15px 25px}.eyebrow{font-size:25px;font-weight:700;color:#da0010}.title{font-size:40px;font-weight:800;white-space:nowrap;transform-origin:left top;position:absolute;left:25px;top:52px}.course{position:absolute;left:25px;top:107px;font-size:25px;font-weight:600}.left{left:40px;top:195px;width:610px;height:435px}.scorelabel{position:absolute;left:35px;top:23px;font-size:25px;font-weight:600}.score{position:absolute;left:35px;top:55px;color:#da0010;font-size:60px;font-weight:800}.stats{position:absolute;left:40px;right:45px;top:153px;font-size:25px;font-weight:600;display:grid;row-gap:18px}.row{display:flex;justify-content:space-between;height:31px}.row.break{margin-top:12px}.right{left:675px;top:195px;width:565px;height:435px}svg{position:absolute;left:720px;top:176px;width:468px;height:468px;overflow:visible}.accuracylabel{position:absolute;left:720px;top:238px;width:468px;text-align:center;font-size:25px;font-weight:600}.rank{position:absolute;left:720px;top:325px;width:468px;text-align:center;font-size:100px;line-height:1.25;font-weight:900;color:#da0010}.accuracy{position:absolute;left:720px;top:457px;width:468px;text-align:center;font-size:40px;font-weight:800}.prompt{position:absolute;left:0;top:657px;width:1280px;text-align:center;font-size:25px;font-weight:600}.black{position:absolute;inset:0;background:#000;pointer-events:none}footer{color:#eee;padding:12px}#viewport{overflow:hidden;width:100%}
</style>
<header><strong>リザルト表示見本</strong><label>判定例 <select id="sample"><option value="mixed">良・可・Miss混在</option><option value="perfect">全良 SS</option><option value="almost">99.999% S</option><option value="empty">通常判定0</option></select></label><button id="replay">演出を再生</button><button id="long">長い日本語タイトル</button><span id="status">ドン: F / J</span></header>
<div id="viewport"><main id="stage"><div class="panel top"><div class="eyebrow">演奏結果</div><div class="title" id="title">おどるポンポコリン</div><div class="course">かんたん　 ★ 1</div></div><div class="panel left"><div class="scorelabel">スコア</div><div class="score" id="score">29,600</div><div class="stats"><div class="row"><span>良</span><span id="good"></span></div><div class="row"><span>可</span><span id="ok"></span></div><div class="row"><span>不可</span><span id="bad"></span></div><div class="row break"><span>最大コンボ</span><span id="combo"></span></div><div class="row"><span>連打数</span><span id="roll"></span></div></div></div><div class="panel right"></div><svg viewBox="-234 -234 468 468"><path id="track" fill="none" stroke="#e0cfb9" stroke-width="30" stroke-linecap="round"/><path id="gauge" fill="none" stroke="#da0010" stroke-width="30" stroke-linecap="round"/></svg><div class="accuracylabel">精度</div><div class="rank" id="rank"></div><div class="accuracy" id="accuracy"></div><div class="prompt" id="prompt"></div><div class="black" id="black"></div></main></div>
<footer>1280×720のレイアウト見本です。DxLib実ゲームのビルド・動作確認は別途必要です。</footer>
<script>
const $=id=>document.getElementById(id),samples={mixed:{g:128,o:14,b:2,m:6,roll:32,balloon:8,score:29600,combo:87},perfect:{g:150,o:0,b:0,m:0,roll:32,balloon:8,score:34400,combo:150},almost:{g:99999,o:0,b:0,m:1,roll:0,balloon:0,score:19999800,combo:99999},empty:{g:0,o:0,b:0,m:0,roll:12,balloon:5,score:1750,combo:0}};
let elapsed=0,last=performance.now(),keys=new Set(),armed=true,data,ratio=0,finalHundredths=0;
function arc(f){if(f<=0)return '';let a=-Math.PI/4,b=a+f*1.5*Math.PI;return `M ${194*Math.cos(a)} ${194*Math.sin(a)} A 194 194 0 ${f>2/3?1:0} 1 ${194*Math.cos(b)} ${194*Math.sin(b)}`}
$('track').setAttribute('d',arc(1));
function rank(v,complete){if(complete&&data.g>0&&data.o+data.b+data.m===0)return 'SS';return v>=9000?'S':v>=8000?'A':v>=6000?'B':'C'}
function reset(){data=samples[$('sample').value];ratio=(data.g+data.o*.5)/(data.g+data.o+data.b+data.m)||0;finalHundredths=Math.floor(ratio*10000);elapsed=0;armed=keys.size===0;last=performance.now();$('good').textContent=data.g;$('ok').textContent=data.o;$('bad').textContent=data.b+data.m;$('roll').textContent=data.roll+data.balloon;$('score').textContent=data.score;$('combo').textContent=data.combo;$('status').textContent='ドン: F / J';render()}
function render(){let t=Math.max(0,Math.min(1,(elapsed-.4)/3)),p=1-(1-t)**3,complete=elapsed>=3.4,v=complete?finalHundredths:Math.min(finalHundredths,Math.floor(ratio*p*10000));$('black').style.opacity=1-Math.min(1,elapsed/.4);$('gauge').setAttribute('d',arc(ratio*p));$('rank').textContent=rank(v,complete);$('accuracy').textContent=(v/100).toFixed(2)+'%';$('prompt').textContent=complete?'ドン（F / J）で選曲へ':'ドン（F / J）で演出をスキップ'}
function resize(){let scale=Math.min(1,innerWidth/1280);$('stage').style.transform=`scale(${scale})`;$('viewport').style.height=720*scale+'px';let width=$('title').scrollWidth;$('title').style.transform=`scale(${Math.min(1,1120/width)})`}
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(!['f','j'].includes(k)||keys.has(k))return;keys.add(k);if(!armed)return;armed=false;if(elapsed<3.4){elapsed=3.4;render()}else{$('status').textContent='選曲へ戻る入力を確認';}});
addEventListener('keyup',e=>{keys.delete(e.key.toLowerCase());if(keys.size===0)armed=true});addEventListener('blur',()=>{keys.clear();armed=true});
$('sample').onchange=reset;$('replay').onclick=reset;$('long').onclick=()=>{$('title').textContent=$('title').textContent.length<30?'長い日本語タイトルの表示を確認するための楽曲名（テスト）おどるポンポコリン':'おどるポンポコリン';resize()};addEventListener('resize',resize);reset();resize();requestAnimationFrame(function tick(now){elapsed=Math.min(3.4,elapsed+(now-last)/1000);last=now;render();requestAnimationFrame(tick)});
</script></html>
