name: Auto demo behavior
on:
  push:
    branches: [feature/auto-demo-play]
  pull_request:
    branches: [feature/integrate-design-unit-test, main]
    paths:
      - 'TaikoFUN/src/Scene/**'
      - 'TaikoFUN/src/Input/**'
      - 'TaikoFUN/src/Audio/SongData.cpp'
      - 'tests/**'
      - '.github/workflows/auto-demo.yml'
permissions:
  contents: read
jobs:
  behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and check idle, demo exit and release policies
        run: |
          c++ -std=c++20 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -fno-sanitize-recover=undefined -I TaikoFUN/src tests/demo_logic_tests.cpp -o /tmp/demo-rules
          /tmp/demo-rules
      - name: Check actual player code with simulated audio, clock and keyboard
        run: |
          mkdir -p /tmp/demo-dxlib
          cp tests/stubs/DxLib.h /tmp/demo-dxlib/DxLib.h
          ln -s DxLib.h /tmp/demo-dxlib/dxlib.h
          c++ -std=c++20 -Wall -Wextra -Wno-switch -fsanitize=undefined -fno-sanitize-recover=undefined -I /tmp/demo-dxlib -I TaikoFUN/src tests/chart_player_demo_tests.cpp TaikoFUN/src/Scene/Play/Logic/ChartPlayer.cpp TaikoFUN/src/Audio/SongData.cpp TaikoFUN/src/Input/Input.cpp -o /tmp/demo-player
          /tmp/demo-player
      - name: Check existing result rules
        run: |
          c++ -std=c++20 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -fno-sanitize-recover=undefined -I TaikoFUN/src tests/result_logic_tests.cpp -o /tmp/result-rules
          /tmp/result-rules
